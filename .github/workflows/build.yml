name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_NAME: luci-app-auth-thu

jobs:
  build:
    name: ${{ matrix.era }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # opkg 体系: OpenWrt / ImmortalWrt 21.02 ~ 23.05
          - era: opkg
            sdk_url: https://downloads.openwrt.org/releases/23.05.6/targets/x86/64/openwrt-sdk-23.05.6-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
            sdk_file: openwrt-sdk-23.05.6-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          # apk 体系: OpenWrt / ImmortalWrt 24.10+
          - era: apk
            sdk_url: https://downloads.openwrt.org/releases/24.10.8/targets/x86/64/openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_file: openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download and extract sdk
        run: |
          wget -q "${{ matrix.sdk_url }}"
          if [[ "${{ matrix.sdk_file }}" == *.zst ]]; then
            tar --zstd -xf "${{ matrix.sdk_file }}"
          else
            tar -xf "${{ matrix.sdk_file }}"
          fi
          mv openwrt-sdk-* sdk
          rm -f "${{ matrix.sdk_file }}"

      - name: update feeds
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: stage package
        run: |
          rm -rf sdk/package/${{ env.PKG_NAME }}
          mkdir -p sdk/package/${{ env.PKG_NAME }}
          cp -r ${{ env.PKG_NAME }}/* sdk/package/${{ env.PKG_NAME }}/
          test -f sdk/package/${{ env.PKG_NAME }}/Makefile

      - name: configure
        run: |
          cd sdk
          echo "CONFIG_PACKAGE_${{ env.PKG_NAME }}=m" > .config
          if [ "${{ matrix.era }}" = "apk" ]; then
            echo "CONFIG_USE_APK=y" >> .config
          fi
          make defconfig

      - name: generate signing keys
        run: |
          mkdir -p public/${{ matrix.era }}
          if [ "${{ matrix.era }}" = "apk" ]; then
            # EC-256 密钥, 与 OpenWrt buildroot 默认 apk 签名机制一致
            sdk/staging_dir/host/bin/openssl ecparam -name prime256v1 -genkey -noout -out sdk/private-key.pem
            sdk/staging_dir/host/bin/openssl ec -in sdk/private-key.pem -pubout > public/apk/public-key.pem
          else
            sdk/staging_dir/host/bin/usign -G -s sdk/key-build -p public/opkg/key-build.pub
          fi

      - name: compile
        run: |
          cd sdk
          rm -rf bin
          make package/${{ env.PKG_NAME }}/compile V=sw -j$(nproc)

      - name: generate index
        run: |
          cd sdk
          if [ "${{ matrix.era }}" = "apk" ]; then
            make package/index
          else
            make CONFIG_SIGNED_PACKAGES=y package/index
          fi

      - name: collect feed
        run: |
          if [ "${{ matrix.era }}" = "apk" ]; then
            cp sdk/bin/packages/x86_64/base/*.apk public/apk/
            cp sdk/bin/packages/x86_64/base/packages.adb public/apk/
          else
            cp sdk/bin/packages/x86_64/base/*.ipk public/opkg/
            cp sdk/bin/packages/x86_64/base/Packages* public/opkg/
          fi
          ls -l public/${{ matrix.era }}

      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            public/${{ matrix.era }}/*.ipk
            public/${{ matrix.era }}/*.apk

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: feed_${{ matrix.era }}
          path: public/${{ matrix.era }}

  feed:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: download
        uses: actions/download-artifact@v4
        with:
          pattern: feed_*
          merge-multiple: true
          path: public

      - name: prepare
        run: |
          touch public/.nojekyll
          ls -R public
          tree --dirsfirst --sort name -P '*.apk|*.ipk' --prune --noreport -H "" -T "luci-app-auth-thu feed" --charset utf-8 -o public/index.html public || true

      - name: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
