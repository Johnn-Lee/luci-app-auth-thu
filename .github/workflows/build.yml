name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_NAME: luci-app-auth-thu

jobs:
  build:
    name: ${{ matrix.era }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenWrt 24.10 and earlier use opkg/ipk.
          - era: opkg
            sdk_url: https://downloads.openwrt.org/releases/24.10.8/targets/x86/64/openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_file: openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            extension: ipk

          # OpenWrt 25.12 and later use apk.
          - era: apk
            sdk_url: https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_file: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            extension: apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and extract SDK
        shell: bash
        run: |
          set -euo pipefail

          wget -q --show-progress "${{ matrix.sdk_url }}" -O "${{ matrix.sdk_file }}"
          mkdir -p sdk
          tar --zstd -xf "${{ matrix.sdk_file }}" --strip-components=1 -C sdk
          rm -f "${{ matrix.sdk_file }}"

          test -x sdk/scripts/feeds
          test -f sdk/Makefile

      - name: Update feeds
        shell: bash
        run: |
          set -euo pipefail
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "sdk/package/${{ env.PKG_NAME }}"
          mkdir -p "sdk/package/${{ env.PKG_NAME }}"
          cp -a "${{ env.PKG_NAME }}/." "sdk/package/${{ env.PKG_NAME }}/"

          test -f "sdk/package/${{ env.PKG_NAME }}/Makefile"

      - name: Configure SDK
        shell: bash
        run: |
          set -euo pipefail
          cd sdk

          echo "CONFIG_PACKAGE_${{ env.PKG_NAME }}=m" > .config

          if [ "${{ matrix.era }}" = "apk" ]; then
            echo 'CONFIG_USE_APK=y' >> .config
          fi

          make defconfig

          grep -q '^CONFIG_PACKAGE_${{ env.PKG_NAME }}=m$' .config

          if [ "${{ matrix.era }}" = "apk" ]; then
            grep -q '^CONFIG_USE_APK=y$' .config
          fi

      - name: Compile package
        shell: bash
        run: |
          set -euo pipefail
          cd sdk

          make "package/${{ env.PKG_NAME }}/compile" V=sc -j"$(nproc)"

      - name: Collect package
        shell: bash
        run: |
          set -euo pipefail

          package_file="$(find sdk/bin/packages/x86_64 -type f -name '${{ env.PKG_NAME }}*.${{ matrix.extension }}' -print -quit)"

          if [ -z "$package_file" ]; then
            echo "Package ${{ env.PKG_NAME }}*.${{ matrix.extension }} was not produced."
            find sdk/bin -maxdepth 5 -type f -print || true
            exit 1
          fi

          mkdir -p dist
          cp "$package_file" "dist/${{ env.PKG_NAME }}.${{ matrix.extension }}"

          echo "Built package:"
          ls -lh "dist/${{ env.PKG_NAME }}.${{ matrix.extension }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-${{ matrix.era }}
          path: dist/${{ env.PKG_NAME }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.PKG_NAME }}-*
          merge-multiple: true
          path: dist

      - name: Verify packages
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/${{ env.PKG_NAME }}.ipk
          test -f dist/${{ env.PKG_NAME }}.apk
          ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.PKG_NAME }}.ipk
            dist/${{ env.PKG_NAME }}.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
